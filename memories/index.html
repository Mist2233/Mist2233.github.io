很平常的一天也是很开心的一天。其实早上起来都没有想到过节这件事，记得昨天好像做学助的时候依稀写下12.23的登记日期，感觉平安夜应该要到了。
两个人应该也算很忙，但是也感觉有一种平淡的幸福。虽然没有见面，但是亲爱的小猫还是会记起前两天我们经过水果店没有买草莓，他说今天想给我补上。应该算很小很小的一件事，我却感觉特别的温暖。可能是因为每一件小小的事情他都会记得。（不过今天下雨，外面天冷冷的湿湿的，所以今天就没有让小猫买啦~）

我好喜欢这种下意识惦记的感觉。生活中的大部分日子其实是无聊或单调。但是这些细小的温暖碎片却可以缝缝补补，让生活有所期待。
